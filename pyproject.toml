[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matched-pathology-analysis"
version = "0.1.0"
description = "Registration, tissue segmentation and matched H&E–mIF spatial analysis"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]
